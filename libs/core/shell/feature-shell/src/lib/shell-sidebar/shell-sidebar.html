<aside class="shell-sidebar" aria-label="Primary navigation">
  <nav class="shell-sidebar__nav">
    @for (section of sections; track section.label) {
      <span class="shell-sidebar__nav-section">
        {{ section.label }}
      </span>

      @for (item of section.items; track item.label) {
        @if (item.route && !item.disabled) {
          <a
            class="shell-sidebar__nav-link"
            [routerLink]="item.route"
            routerLinkActive="shell-sidebar__nav-link--active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span>{{ item.label }}</span>

            @if (item.badge) {
              <ioc-ui-badge variant="neutral" size="sm">
                {{ item.badge }}
              </ioc-ui-badge>
            }
          </a>
        } @else {
          <span class="shell-sidebar__nav-link shell-sidebar__nav-link--disabled">
            <span>{{ item.label }}</span>

            @if (item.badge) {
              <ioc-ui-badge variant="neutral" size="sm">
                {{ item.badge }}
              </ioc-ui-badge>
            }
          </span>
        }
      }
    }
  </nav>
</aside>
